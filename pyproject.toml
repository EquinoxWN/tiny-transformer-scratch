[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-transformer-scratch"
version = "0.1.0"
description = "Understand how ChatGPT actually works by building a small one end to end: tokenizer, training and text generation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pip-audit>=2.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
tiny-bpe = "tiny_transformer_scratch.bpe:main"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# Bugs, security (bandit), modern syntax, imports, naming and test style; `ruff format` owns line length.
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "N", "C4", "PT", "RET", "PIE", "PERF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert, throwaway credentials and seeded (non-cryptographic) randomness on purpose.
"tests/**" = ["S101", "S105", "S106", "S311"]
